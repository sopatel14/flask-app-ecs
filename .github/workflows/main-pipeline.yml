name: Main Pipeline


permissions:
  contents: read

on:
  push:
    branches:
      - main

jobs:
  # Job 1: Build and Test
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run Tests
        run: |
          python -m compileall .
          echo "Tests completed successfully."

  # Job 2: Docker Build, Scan, and Push
  docker:
    needs: build-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.docker_username }}
          password: ${{ secrets.docker_token }}

      # Step 1: Build Docker image
      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.docker_username }}/flask-app-ecs:latest .
          docker tag ${{ secrets.docker_username }}/flask-app-ecs:latest ${{ secrets.docker_username }}/flask-app-ecs:${{ github.sha }}

      # Step 2: SCAN Docker image for vulnerabilities (TASK 1)
      - name: Scan Docker Image for Vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.docker_username }}/flask-app-ecs:latest
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      # Step 3: Push Docker image (only if scan passed)
      - name: Push Docker Image
        if: success()
        run: |
          docker push ${{ secrets.docker_username }}/flask-app-ecs:latest
          docker push ${{ secrets.docker_username }}/flask-app-ecs:${{ github.sha }}

  # Job 3: Deploy
  deploy:
    name: Deploy to Production
    needs: docker
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy Application
        run: |
          echo "Deploying image: ${{ secrets.docker_username }}/flask-app-ecs:latest to production"